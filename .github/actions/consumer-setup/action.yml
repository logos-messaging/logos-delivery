name: 'Consumer setup'
description: >
  Runs `nimble setup` in a new project that requires the given commit of
  logos-delivery, with no lockfile. The setup also fails when a dependency
  does not install or build.

inputs:
  revision:
    description: 'The logos-delivery commit that the new project requires.'
    required: true

outputs:
  succeeded:
    description: '"true" when the setup succeeded, else "false".'
    value: ${{ steps.setup.outputs.succeeded }}

runs:
  using: composite
  steps:
    - name: Install Nimble
      shell: bash
      run: make install-nimble

    - name: Run Nimble setup in a new project that requires logos-delivery
      id: setup
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        REVISION: ${{ inputs.revision }}
      run: |
        rm -rf consumer ~/.nimble
        mkdir consumer
        cd consumer
        cat > consumer.nimble <<EOF
        version = "0.1.0"
        author = "Logos"
        description = "Consumer dependency check"
        license = "MIT"
        requires "https://github.com/${GITHUB_REPOSITORY}#${REVISION}"
        EOF
        nimble="$(make -s -C "${GITHUB_WORKSPACE}" print-nimble-path)/nimble"
        # Try a second time from an empty Nimble directory, so that a network
        # error alone does not fail the setup.
        if "${nimble}" setup -y || { rm -rf ~/.nimble; "${nimble}" setup -y; }; then
          echo "succeeded=true" >> "${GITHUB_OUTPUT}"
        else
          echo "succeeded=false" >> "${GITHUB_OUTPUT}"
        fi
