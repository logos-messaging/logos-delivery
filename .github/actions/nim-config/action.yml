name: 'Select the Nim configuration'
description: >
  Maps a CI configuration name to a Nim version and a memory manager, and
  exports NIM_MM for the Makefile. The one place that says what each
  configuration means.

inputs:
  config:
    description: >
      default: the locked Nim with ORC, what the node ships and Status builds.
      refc: the locked Nim with refc, for hosts that still use it.
      nim-latest: the newest Nim release with ORC, other dependencies locked.
    default: 'default'

runs:
  using: composite
  steps:
    - name: Select Nim and memory manager
      shell: bash
      run: |
        case "${{ inputs.config }}" in
          default)    mm=orc ;;
          refc)       mm=refc ;;
          # Repoints the lock's nim entry; deleting it makes Nimble re-solve
          # every dependency, which fails. Bump on each Nim release.
          nim-latest)
            mm=orc
            jq '.packages.nim.version = "2.4.0"
              | .packages.nim.vcsRevision = "14991af742d0833503741fd9a0918133d1bcf8a4"
              | .packages.nim.checksums.sha1 = "e4e638a20c4650cc6b463f8b19f5009db3a916b5"' \
              nimble.lock > nimble.lock.tmp && mv nimble.lock.tmp nimble.lock ;;
          *) echo "::error::unknown Nim config: ${{ inputs.config }}"; exit 1 ;;
        esac
        echo "NIM_MM=$mm" >> "$GITHUB_ENV"
