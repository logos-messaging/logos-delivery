name: Daily logos-delivery CI

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

env:
  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--parallelBuild:${NPROC} --colors:off -d:chronicles_colors:none"

jobs:
  build-health:
    uses: ./.github/workflows/build-health.yml

  deps-freshness:
    name: "nix/deps.nix freshness"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: Regenerate nix/deps.nix and compare
        run: |
          # The generator reads repository revisions from nimble.lock; it
          # does not select newer package versions or follow current release
          # tags. The diff detects differences between the generated Nix
          # expressions and the committed file. Unfetchable revisions,
          # generator failures, and tool or environment incompatibilities
          # also fail this step.
          # nix-prefetch-git from the nixpkgs revision that flake.lock pins.
          nix shell --inputs-from . nixpkgs#nix-prefetch-git --command ./tools/gen-nix-deps.sh nimble.lock /tmp/deps.nix.fresh
          diff /tmp/deps.nix.fresh nix/deps.nix

  # Fails when `nimble lock` cannot solve logos_delivery.nimble from scratch.
  lock-resolution:
    name: "nimble.lock resolution"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run Nimble lock
        id: lock
        uses: ./.github/actions/lock-check
        with:
          target: master

      - name: Fail if Nimble lock failed
        if: ${{ steps.lock.outputs.succeeded != 'true' }}
        run: |
          echo "::error::Nimble lock fails on master (${GITHUB_SHA:0:8}). The notice \"Nimble lock fails on master\" shows the error."
          exit 1

  # Runs Nimble setup in a new project that requires the checked-out commit of
  # logos-delivery, with no lockfile.
  consumer-deps:
    name: "Consumer dependency resolution"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up a consumer of this commit
        id: setup
        uses: ./.github/actions/consumer-setup
        with:
          revision: ${{ github.sha }}
          target: master

      - name: Fail if the setup failed
        if: ${{ steps.setup.outputs.succeeded != 'true' }}
        run: |
          echo "::error::Nimble setup of a project that requires logos-delivery fails on master (${GITHUB_SHA:0:8}). The notice \"Nimble setup of a project that requires logos-delivery fails on master\" shows the error."
          exit 1

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    name: build-${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get submodules hash
        id: submodules
        run: |
          echo "hash=$(git submodule status | awk '{print $1}' | sort | shasum -a 256 | sed 's/[ -]*//g')" >> $GITHUB_OUTPUT

      - name: Cache submodules
        uses: actions/cache@v3
        with:
          path: |
            vendor/
            .git/modules
          key: ${{ runner.os }}-vendor-modules-${{ steps.submodules.outputs.hash }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps

      - name: Build binaries
        # -j1: concurrent nimble tasks corrupt shared package metadata.
        run: make V=1 -j1 examples tools

      - name: Audit installed deps
        run: make audit-deps

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "::warning::DISCORD_WEBHOOK_URL is not set; skipping the Discord notification"; exit 0; }
          STATUS="${{ job.status }}"
          OS="${{ matrix.os }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ CI Success"
          else
            COLOR=15158332
            TITLE="❌ CI Failed"
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Repository\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"OS\", \"value\": \"$OS\", \"inline\": true},
                  {\"name\": \"Status\", \"value\": \"$STATUS\", \"inline\": true}
                ],
                \"url\": \"$RUN_URL\",
                \"footer\": {\"text\": \"Daily logos-delivery CI\"}
              }]
            }" \
            "$DISCORD_WEBHOOK_URL"

  # RLN end-to-end against the simulator. Defaults from tests/simulator/rln-sim.env.
  rln-simulator:
    uses: ./.github/workflows/ci-rln-simulator.yml
    secrets: inherit
