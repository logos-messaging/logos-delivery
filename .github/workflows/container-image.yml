name: container-image-build

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        default: ${{ github.event.number }}
      artifact_fallback:
        description: "If the quay.io push fails, hand the image over as a GitHub artifact instead of failing."
        type: boolean
        default: false
    outputs:
      image:
        description: The resulting image link
        value: ${{ jobs.build-docker-image.outputs.image }}
      image_artifact:
        description: "Artifact holding the image when the push failed and artifact_fallback is set; empty otherwise."
        value: ${{ jobs.build-docker-image.outputs.image_artifact }}

env:
  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--parallelBuild:${NPROC} -d:chronicles_colors:none"
  NIM_VERSION: '2.2.6'

# This workflow should not run for outside contributors
# If org secrets are not available, we'll avoid building and publishing the docker image and we'll pass the workflow
jobs:
  build-docker-image:
    strategy:
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    name: docker-build-${{ matrix.os }}
    outputs:
      image: ${{ steps.build.outputs.image }}
      image_artifact: ${{ steps.push.outputs.pushed == 'false' && 'node-image' || '' }}
    steps:
      - name: Check secrets
        id: secrets
        continue-on-error: true
        run: |
          if [[ -z "$QUAY_PASSWORD" || -z "$QUAY_USER" ]]; then
            echo "User does not have access to secrets, skipping workflow"
            exit 1
          fi
        env:
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USER: ${{ secrets.QUAY_USER }}

      - name: Checkout code
        if: ${{ steps.secrets.outcome == 'success' }}
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        if: ${{ steps.secrets.outcome == 'success' }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        if: ${{ steps.secrets.outcome == 'success' }}
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build binaries
        if: ${{ steps.secrets.outcome == 'success' }}
        run: |
          make -j${NPROC} V=1 DEBUG=0 POSTGRES=1 logosdeliverynode
          make -j${NPROC} V=1 DEBUG=0 rlnkeystore

      - name: Audit installed deps
        if: ${{ steps.secrets.outcome == 'success' }}
        run: make audit-deps

      - name: Build images
        id: build
        if: ${{ steps.secrets.outcome == 'success' }}
        run: |
          SHORT_REF=$(git rev-parse --short HEAD)

          TAG=$([ "${PR_NUMBER}" == "" ] && echo "${SHORT_REF}" || echo "${PR_NUMBER}")
          IMAGE=quay.io/wakuorg/nwaku-pr:${TAG}

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

          docker build -t ${IMAGE} -f docker/binaries/Dockerfile.bn.amd64 --label quay.expires-after=30d .
        env:
          PR_NUMBER: ${{ inputs.image_tag}}

      # A quay.io outage must not fail CI when the caller can take the image as
      # an artifact instead; without artifact_fallback a failed push still fails.
      - name: Push image
        id: push
        if: ${{ steps.secrets.outcome == 'success' }}
        shell: bash
        run: |
          if { docker login -u ${QUAY_USER} -p ${QUAY_PASSWORD} quay.io \
               && docker push ${IMAGE}; } 2>&1 | tee push.log; then
            echo "pushed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          ERROR=$(grep -v '^[[:space:]]*$' push.log | tail -n 1)
          echo "pushed=false" >> $GITHUB_OUTPUT
          echo "error=${ERROR}" >> $GITHUB_OUTPUT
          if [[ "${ARTIFACT_FALLBACK}" != "true" ]]; then
            exit 1
          fi

          echo "::warning title=quay.io push failed::Could not push ${IMAGE} (${ERROR}). quay.io may be having an outage, see https://status.redhat.com. The image is passed to the e2e jobs as the node-image artifact."
          {
            echo "### :warning: quay.io push failed"
            echo "Could not push \`${IMAGE}\`: \`${ERROR}\`"
            echo
            echo "quay.io may be having an outage, see https://status.redhat.com."
            echo "The image is passed to the e2e jobs as the \`node-image\` artifact instead."
          } >> $GITHUB_STEP_SUMMARY
        env:
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USER: ${{ secrets.QUAY_USER }}
          IMAGE: ${{ steps.build.outputs.image }}
          ARTIFACT_FALLBACK: ${{ inputs.artifact_fallback }}

      - name: Save image
        if: ${{ steps.push.outputs.pushed == 'false' }}
        run: docker save ${IMAGE} | gzip > node-image.tar.gz
        env:
          IMAGE: ${{ steps.build.outputs.image }}

      - name: Upload image artifact
        if: ${{ steps.push.outputs.pushed == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: node-image
          path: node-image.tar.gz
          retention-days: 1
          compression-level: 0
          # A re-run of this job uploads the same name again.
          overwrite: true

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        if: ${{ github.event_name == 'pull_request' && steps.push.outputs.pushed == 'true' }}
        with:
          message: |
            You can find the image built from this PR at

            ```
            ${{steps.build.outputs.image}}
            ```

            Built from ${{ steps.build.outputs.commit_hash }}
          # The tag used to append the undefined matrix.rln_version, which
          # resolved to this; keeping it updates the existing PR comments.
          comment_tag: execution-rln-v

      - name: Comment PR (quay.io push failed)
        uses: thollander/actions-comment-pull-request@v2
        if: ${{ github.event_name == 'pull_request' && steps.push.outputs.pushed == 'false' }}
        with:
          message: |
            :warning: Could not push the image built from this PR to quay.io, which may be having an outage (see https://status.redhat.com):

            ```
            ${{ steps.push.outputs.error }}
            ```

            The CI e2e jobs got the image as the `node-image` artifact of [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) instead, so they still test this PR.

            Built from ${{ steps.build.outputs.commit_hash }}
          # Same tag, so this replaces the comment of a previous successful push.
          comment_tag: execution-rln-v
