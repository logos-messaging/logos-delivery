name: tests-e2e-c-abi

on:
  workflow_call:
    inputs:
      node_image:
        description: "Node image used for the docker peers (docker subset only)."
        type: string
        required: false
        default: ""
      node_image_artifact:
        description: "Artifact holding node_image when it could not be pushed to quay.io."
        type: string
        required: false
        default: ""
  # The non-docker tests, including the minutes-long `slow` ones kept off PRs.
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:

env:
  NIM_VERSION: '2.2.6'

jobs:
  c-abi:
    # ci.yml calls this workflow on pull_request, merge_group and push.
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        subset: [non-docker, docker]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    name: ${{ matrix.subset == 'docker' && 'c-abi-docker' || 'c-abi' }}
    env:
      NODE_1: ${{ inputs.node_image }}
      NODE_2: ${{ inputs.node_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Consumes the shared library built by ci.yml's `build` job (same run).
      - name: Download liblogosdelivery.so
        uses: actions/download-artifact@v4
        with:
          name: liblogosdelivery
          path: tests-e2e/vendor/logos-delivery-python-bindings/lib

      # Loaded under its quay.io name, so the tests use it without pulling.
      - name: Download node image
        if: ${{ matrix.subset == 'docker' && inputs.node_image_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.node_image_artifact }}
          path: ${{ runner.temp }}/node-image

      - name: Load node image
        if: ${{ matrix.subset == 'docker' && inputs.node_image_artifact != '' }}
        run: docker load -i "${RUNNER_TEMP}/node-image/node-image.tar.gz"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests-e2e/requirements.txt

      - name: Install Python deps
        run: pip install -r tests-e2e/requirements.txt

      - name: Run C ABI e2e tests (${{ matrix.subset }} subset)
        working-directory: tests-e2e
        run: |
          echo "docker peer image: ${NODE_2:-public default (DEFAULT_NWAKU)}"
          pytest tests/c_abi -m "${{ matrix.subset == 'docker' && 'docker_required' || 'not docker_required and not slow' }}" -n 4 --dist=loadgroup --reruns 2 --junitxml=log/junit.xml

      - name: Report results in the job summary
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.subset == 'docker' && 'c-abi-docker' || 'c-abi' }}
          path: tests-e2e/log/junit.xml
          reporter: python-xunit

  c-abi-nightly:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    name: c-abi-nightly
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No `build` job runs on schedule or dispatch, so build the library from this checkout.
      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build liblogosdelivery.so
        env:
          NIMFLAGS: "--parallelBuild:2 -d:chronicles_colors:none"
        run: ./tests-e2e/scripts/prepare_lib.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests-e2e/requirements.txt

      - name: Install Python deps
        run: pip install -r tests-e2e/requirements.txt

      - name: Run C ABI e2e tests (non-docker subset, slow included)
        working-directory: tests-e2e
        run: pytest tests/c_abi -m "not docker_required" -n 4 --dist=loadgroup --reruns 2
