name: tests-e2e-c-abi

on:
  workflow_call:
    inputs:
      node_image:
        description: "Node image used for the docker peers (docker subset only)."
        type: string
        required: false
        default: ""
      node_image_artifact:
        description: "Artifact holding node_image when it could not be pushed to quay.io."
        type: string
        required: false
        default: ""

jobs:
  c-abi:
    strategy:
      fail-fast: false
      matrix:
        subset: [non-docker, docker]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    name: ${{ matrix.subset == 'docker' && 'c-abi-docker' || 'c-abi' }}
    env:
      NODE_1: ${{ inputs.node_image }}
      NODE_2: ${{ inputs.node_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # .gitmodules sets `update = none` for it, which only `--checkout` overrides.
      - name: Checkout Python bindings
        run: git submodule update --init --checkout tests-e2e/vendor/logos-delivery-python-bindings

      # Consumes the shared library built by ci.yml's `build` job (same run).
      - name: Download liblogosdelivery.so
        uses: actions/download-artifact@v4
        with:
          name: liblogosdelivery
          path: tests-e2e/vendor/logos-delivery-python-bindings/lib

      # Loaded under its quay.io name, so the tests use it without pulling.
      - name: Download node image
        if: ${{ matrix.subset == 'docker' && inputs.node_image_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.node_image_artifact }}
          path: ${{ runner.temp }}/node-image

      - name: Load node image
        if: ${{ matrix.subset == 'docker' && inputs.node_image_artifact != '' }}
        run: docker load -i "${RUNNER_TEMP}/node-image/node-image.tar.gz"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests-e2e/requirements.txt

      - name: Install Python deps
        run: pip install -r tests-e2e/requirements.txt

      - name: Run C ABI e2e tests (${{ matrix.subset }} subset)
        id: tests
        working-directory: tests-e2e
        run: |
          echo "docker peer image: ${NODE_2:-public default (DEFAULT_NWAKU)}"
          pytest tests/c_abi -m "${{ matrix.subset == 'docker' && 'docker_required' || 'not docker_required and not slow' }}" -n 4 --dist=loadgroup --reruns 2 --junitxml=log/junit.xml

      # Collected by ci.yml's test-report job.
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.subset == 'docker' && 'c-abi-docker' || 'c-abi' }}
          path: tests-e2e/log/junit.xml
          retention-days: 1

      - name: Upload logs
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: c-abi-logs-${{ matrix.subset }}
          path: tests-e2e/log/
