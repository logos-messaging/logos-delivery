name: e2e-rest-tests

on:
  workflow_call:
    inputs:
      node_image:
        description: "Node image every docker node runs (sets DEFAULT_NWAKU)."
        type: string
        required: false
        default: ""
      node_image_artifact:
        description: "Artifact holding node_image when it could not be pushed to quay.io."
        type: string
        required: false
        default: ""
  schedule:
    # After pre-release.yml (03:13) has refreshed quay.io/wakuorg/nwaku-pr:nightly.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      default_nwaku:
        description: "Image for every node without a more specific input below."
        type: string
        required: false
        default: "quay.io/wakuorg/nwaku-pr:nightly"
      node1:
        description: "Image for NODE_1."
        type: string
        required: false
        default: ""
      node2:
        description: "Image for NODE_2."
        type: string
        required: false
        default: ""
      additional_nodes:
        description: "Comma-separated images for ADDITIONAL_NODES."
        type: string
        required: false
        default: ""

env:
  NIM_VERSION: '2.2.12'
  NIGHTLY_IMAGE: quay.io/wakuorg/nwaku-pr:nightly

jobs:
  rest-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    name: rest-e2e
    env:
      # Empty values fall back in src/env_vars.py: 
      # DEFAULT_NWAKU to the pinned default,
      # NODE_1/NODE_2/ADDITIONAL_NODES to DEFAULT_NWAKU.
      DEFAULT_NWAKU: ${{ github.event_name == 'schedule' && 'quay.io/wakuorg/nwaku-pr:nightly' || inputs.node_image || inputs.default_nwaku }}
      NODE_1: ${{ inputs.node1 }}
      NODE_2: ${{ inputs.node2 }}
      ADDITIONAL_NODES: ${{ inputs.additional_nodes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Loaded under its quay.io name, so the tests use it without pulling.
      - name: Download node image
        if: ${{ inputs.node_image_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.node_image_artifact }}
          path: ${{ runner.temp }}/node-image

      - name: Load node image
        if: ${{ inputs.node_image_artifact != '' }}
        run: docker load -i "${RUNNER_TEMP}/node-image/node-image.tar.gz"

      # The nightly image comes from pre-release.yml via quay.io, refreshed every
      # night at 03:13. When it cannot be pulled (quay.io outage) or is older
      # than 24h (that night's push failed), rebuild it from this checkout under
      # the same name. The rebuild is cached per commit, so re-runs reuse it.
      - name: Pull nightly image
        id: nightly
        if: ${{ env.DEFAULT_NWAKU == env.NIGHTLY_IMAGE }}
        continue-on-error: true
        run: |
          if ! docker pull "${NIGHTLY_IMAGE}"; then
            echo "::warning title=Nightly image unavailable::Could not pull ${NIGHTLY_IMAGE}; rebuilding it from ${GITHUB_SHA}."
            exit 1
          fi
          CREATED=$(docker image inspect -f '{{.Created}}' "${NIGHTLY_IMAGE}")
          AGE_H=$(( ($(date +%s) - $(date -d "${CREATED}" +%s)) / 3600 ))
          echo "${NIGHTLY_IMAGE} was built ${CREATED} (${AGE_H}h ago)"
          if (( AGE_H >= 24 )); then
            echo "::warning title=Stale nightly image::${NIGHTLY_IMAGE} is ${AGE_H}h old; rebuilding it from ${GITHUB_SHA}."
            exit 1
          fi

      - name: Restore rebuilt nightly image
        id: nightly-cache
        if: ${{ steps.nightly.outcome == 'failure' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nightly-image.tar.gz
          key: nightly-image-${{ github.sha }}

      - name: Load rebuilt nightly image
        if: ${{ steps.nightly-cache.outputs.cache-hit == 'true' }}
        run: docker load -i "${RUNNER_TEMP}/nightly-image.tar.gz"

      - name: Install Nim ${{ env.NIM_VERSION }}
        if: ${{ steps.nightly.outcome == 'failure' && steps.nightly-cache.outputs.cache-hit != 'true' }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        if: ${{ steps.nightly.outcome == 'failure' && steps.nightly-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build nightly image
        if: ${{ steps.nightly.outcome == 'failure' && steps.nightly-cache.outputs.cache-hit != 'true' }}
        env:
          NIMFLAGS: "--parallelBuild:2 -d:chronicles_colors:none"
        run: |
          make -j2 V=1 DEBUG=0 POSTGRES=1 logosdeliverynode
          make -j2 V=1 DEBUG=0 rlnkeystore
          docker build -t "${NIGHTLY_IMAGE}" -f docker/binaries/Dockerfile.bn.amd64 .
          docker save "${NIGHTLY_IMAGE}" | gzip > "${RUNNER_TEMP}/nightly-image.tar.gz"

      - name: Cache rebuilt nightly image
        if: ${{ steps.nightly.outcome == 'failure' && steps.nightly-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nightly-image.tar.gz
          key: nightly-image-${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests-e2e/requirements.txt

      - name: Install Python deps
        run: pip install -r tests-e2e/requirements.txt

      - name: Run REST tests
        id: tests
        working-directory: tests-e2e
        run: |
          echo "node image: ${DEFAULT_NWAKU:-pinned default (see src/env_vars.py)}"
          pytest tests/rest -n 4 --dist=loadgroup --reruns 1 --junitxml=log/junit.xml

      - name: Report results in the job summary
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: rest-e2e
          path: tests-e2e/log/junit.xml
          reporter: python-xunit

      - name: Upload logs
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: rest-e2e-logs-${{ github.event_name }}
          path: tests-e2e/log/
