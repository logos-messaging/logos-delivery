name: ci

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--parallelBuild:${NPROC} --colors:off -d:chronicles_colors:none"
  NIM_VERSION: '2.2.6'

jobs:
  changes: # skip the build/test jobs when a PR only touches documentation
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    steps:
    - uses: actions/checkout@v4
      name: Checkout code
      id: checkout
    # Deny-list rather than allow-list: every path is code unless it is one of
    # the doc files below, so a new source directory is covered without anyone
    # remembering to extend this filter.
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        # 'some-with-excludes' is what makes the '!' patterns subtractive; the
        # default 'some' would match every file against the bare '**'.
        predicate-quantifier: 'some-with-excludes'
        filters: |
          code:
          - '**'
          - '!**/*.md'
          - '!docs/**'
          - '!LICENSE-*'
          - '!.github/ISSUE_TEMPLATE/**'

    outputs:
      code: ${{ steps.filter.outputs.code }}

  build-health:
    uses: ./.github/workflows/build-health.yml

  build:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    name: build-${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build binaries
        # -j1: `all` builds logosdeliverynode and liblogosdelivery, each via `nimble
        # <task>`. Under -j2 the two nimble invocations re-resolve git deps
        # concurrently and clobber each other in the shared ~/.nimble/pkgcache
        # (e.g. "destination already exists", "could not lock config file"),
        # failing the build. Serializing the targets removes the race; Nim's
        # own --parallelBuild still parallelizes compilation. Mirrors the test
        # job, which already forces -j1.
        run: make V=1 -j1 all

      - name: Build FFI examples
        run: make V=1 -j1 ffi-examples

      - name: Audit installed deps
        run: make audit-deps

      # Publish the freshly built shared library so the e2e-api-tests workflow
      # can run the wrapper suite against it without rebuilding. Only the Linux
      # build is uploaded since those jobs run on ubuntu-22.04.
      - name: Upload liblogosdelivery.so
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: liblogosdelivery
          path: build/liblogosdelivery.so
          retention-days: 1

  # Runs `make liblogosdelivery` with the default flags to test compile and link.
  liblogosdelivery-default:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NIMFLAGS: ""

    name: liblogosdelivery default build - ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: make liblogosdelivery
        run: make V=1 -j1 liblogosdelivery

  build-windows:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/windows-build.yml
    with:
      branch: ${{ github.ref }}

  build-android:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 only: amd64 is blocked by a nim-lsquic android type mismatch,
        # 32-bit ABIs by int overflows in nim-brokers and waku_store_sync.
        target: [arm64]
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    name: build-android-${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Keyed on the script so a change of the pinned cross rev invalidates it.
      - name: Cache cross
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross-${{ hashFiles('scripts/build_rln_android.sh') }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}
          # The NDK compiler rewrites the nimbledeps archives, so this job does not share the host jobs' cache.
          cache: 'false'

      - name: Build liblogosdelivery for android-${{ matrix.target }}
        # -j1: see the build job.
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: make V=1 -j1 liblogosdelivery-android-${{ matrix.target }}

      - name: Audit installed deps
        run: make audit-deps

      - name: Upload android libraries
        uses: actions/upload-artifact@v4
        with:
          name: liblogosdelivery-android-${{ matrix.target }}
          path: build/android/
          retention-days: 1

  # macos-15 runners ship full Xcode with the iOS SDKs preinstalled.
  build-ios:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        sdk: [device, simulator]
    runs-on: macos-15
    timeout-minutes: 60

    name: build-ios-${{ matrix.sdk }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Shares the host macOS cache: the iOS build never writes into nimbledeps/.
      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build liblogosdelivery for ios-${{ matrix.sdk }}
        # -j1: see the build job.
        run: make V=1 -j1 liblogosdelivery-ios-${{ matrix.sdk }}

      - name: Audit installed deps
        run: make audit-deps

      - name: Upload iOS library
        uses: actions/upload-artifact@v4
        with:
          name: liblogosdelivery-ios-${{ matrix.sdk }}
          path: |
            build/ios/*/liblogosdelivery.a
            build/ios/*/liblogosdelivery.h
          retention-days: 1

  tests:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/tests.yml

  build-docker-image:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/container-image.yml
    secrets: inherit

  # Send API E2E tests run the in-repo tests-e2e/ wrapper suite against the
  # liblogosdelivery.so built by the `build` job (downloaded as the
  # `liblogosdelivery` artifact). Gated on `build`, so it is skipped on
  # docs-only PRs where no lib is built.
  send-api-e2e-tests:
    needs: build
    uses: ./.github/workflows/e2e-api-tests.yml
    with:
      subset: non-docker
    secrets: inherit

  # Docker subset; an empty node_image falls back to DEFAULT_NWAKU (fork PRs lack the quay secrets).
  send-api-e2e-docker-tests:
    needs: [build, build-docker-image]
    uses: ./.github/workflows/e2e-api-tests.yml
    with:
      subset: docker
      node_image: ${{ needs.build-docker-image.outputs.image }}
    secrets: inherit

  # E2E tests that run the node docker image and drive it over its REST API
  rest-e2e-tests:
    needs: build-docker-image
    uses: ./.github/workflows/e2e-rest-tests.yml
    with:
      node_image: ${{ needs.build-docker-image.outputs.image }}
    secrets: inherit

  lint:
    name: "Lint"
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build nph
        run: |
          make build-nph

      - name: Check nph formatting
        run: |
          shopt -s extglob  # Enable extended globbing
          NPH=$(make print-nph-path)
          echo "using nph at ${NPH}"
          "${NPH}" examples logos_delivery tests tools apps *.@(nim|nims|nimble)
          git diff --exit-code
