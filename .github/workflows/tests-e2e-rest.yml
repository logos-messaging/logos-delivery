name: tests-e2e-rest

on:
  workflow_call:
    inputs:
      node_image:
        description: "Node image every docker node runs (sets DEFAULT_NWAKU)."
        type: string
        required: false
        default: ""
      node_image_artifact:
        description: "Artifact holding node_image when it could not be pushed to quay.io."
        type: string
        required: false
        default: ""

jobs:
  rest:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    name: rest
    env:
      # An empty value falls back to the pinned default in src/env_vars.py.
      DEFAULT_NWAKU: ${{ inputs.node_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Loaded under its quay.io name, so the tests use it without pulling.
      - name: Download node image
        if: ${{ inputs.node_image_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.node_image_artifact }}
          path: ${{ runner.temp }}/node-image

      - name: Load node image
        if: ${{ inputs.node_image_artifact != '' }}
        run: docker load -i "${RUNNER_TEMP}/node-image/node-image.tar.gz"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests-e2e/requirements.txt

      - name: Install Python deps
        run: pip install -r tests-e2e/requirements.txt

      - name: Run REST tests
        id: tests
        working-directory: tests-e2e
        run: |
          echo "node image: ${DEFAULT_NWAKU:-pinned default (see src/env_vars.py)}"
          pytest tests/rest -n 4 --dist=loadgroup --reruns 1 --junitxml=log/junit.xml

      # Joins a live fleet. Kept off PRs so that they do not depend on it.
      - name: Run fleet tests
        id: fleet
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        working-directory: tests-e2e
        run: pytest tests/fleet -n 4 --dist=loadgroup --reruns 1 --junitxml=log/junit-fleet.xml

      # Collected by ci.yml's test-report job.
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-rest
          path: tests-e2e/log/junit.xml
          retention-days: 1

      - name: Upload logs
        if: ${{ failure() && (steps.tests.outcome == 'failure' || steps.fleet.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: rest-logs-${{ github.event_name }}
          path: tests-e2e/log/
