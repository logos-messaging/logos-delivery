name: tests

on:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        # One job per binary, except testcommon and testapp: both are almost
        # all compile, and paired they still finish well inside testwaku.
        suite:
          - {name: testcommon-testapp, targets: testcommon testapp}
          - {name: testwaku, targets: testwaku}
          - {name: testwakuext, targets: testwakuext}
          - {name: testlogosdelivery, targets: testlogosdelivery}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    name: ${{ matrix.suite.name }}-${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps

      - name: Run tests
        run: |
          # all_tests_waku carries the only postgres suites.
          postgres_enabled=0
          if [ "${{ runner.os }}" = Linux ] && [ "${{ matrix.suite.name }}" = testwaku ]; then
            sudo docker run --rm -d -e POSTGRES_PASSWORD=test123 -p 5432:5432 postgres:15.4-alpine3.18
            postgres_enabled=1
          fi

          export MAKEFLAGS="-j1"
          export NIMFLAGS="--colors:off -d:chronicles_colors:none"

          make V=1 POSTGRES=$postgres_enabled ${{ matrix.suite.targets }}

      - name: Audit installed deps
        run: make audit-deps
