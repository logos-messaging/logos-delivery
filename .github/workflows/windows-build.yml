name: ci / build-windows

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

env:
  NPROC: 4
  NIM_VERSION: '2.2.12'
  CCACHE_VERSION: '4.14'
  CCACHE_SHA256: 2568347a697e103ca1b073981c704ad76fb2507d066c38dba038dd73399d968f

jobs:
  build:
    # One job per artifact: built back to back they made this the slowest job in ci.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: logosdeliverynode
            make: make logosdeliverynode POSTGRES=1 V=3 -j$NPROC
            output: build/logosdeliverynode.exe
          - target: liblogosdelivery
            make: make liblogosdelivery STATIC=0 V=1 -j
            output: build/liblogosdelivery.dll
    name: build-${{ matrix.target }}
    runs-on: windows-latest
    # A green build takes 20-30 min. Fail a hung one instead of holding the
    # runner for the 6 h default.
    timeout-minutes: 60

    defaults:
      run:
        shell: msys2 {0}

    env:
      MSYSTEM: MINGW64
      # MSYS2 installs gcc afresh on every run, so its mtime, ccache's default
      # compiler check, would miss every time.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M

    steps:
    - name: Configure Git to keep LF line endings
      # Windows Git defaults to core.autocrlf=true. The LF→CRLF conversion
      # changes the SHA1 of nimble's cloned deps, so they no longer match
      # nimble.lock and nimble re-downloads them on every run (hanging the
      # job). Disable autocrlf so clones match the Linux-computed checksums.
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          git
          base-devel
          mingw-w64-x86_64-toolchain
          make
          cmake
          upx
          unzip
          mingw-w64-x86_64-rust
          mingw-w64-x86_64-postgresql
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-gcc-libs
          mingw-w64-x86_64-libwinpthread-git
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-python
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-llvm
          mingw-w64-x86_64-clang
          mingw-w64-x86_64-nasm

    - name: Configure Git in MSYS2 to keep LF line endings
      # The step above only configures Git for Windows. nimble clones its deps
      # from the MSYS2 shell, whose git reads a separate global config, so the
      # same setting must be repeated here.
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Manually install nasm
      run: |
        bash scripts/install_nasm_in_windows.sh
        source $HOME/.bashrc

    - name: Add UPX to PATH
      run: |
        echo "/usr/bin:$PATH" >> $GITHUB_PATH
        echo "/mingw64/bin:$PATH" >> $GITHUB_PATH
        echo "/usr/lib:$PATH" >> $GITHUB_PATH
        echo "/mingw64/lib:$PATH" >> $GITHUB_PATH

    - name: Verify dependencies
      run: |
        which upx gcc g++ make cmake cargo rustc python nasm

    - name: Install Nim ${{ env.NIM_VERSION }}
      uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: ${{ env.NIM_VERSION }}
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install nimble deps
      uses: ./.github/actions/nimble-deps
      with:
        nim-version: ${{ env.NIM_VERSION }}
        make-args: CC=gcc

    - name: Creating tmp directory
      run: mkdir -p tmp

    # Nim quotes the compiler command, so "ccache gcc" cannot stand in for gcc.
    # Copies of ccache named gcc.exe and g++.exe masquerade as the compilers
    # instead, and --gcc.path points Nim at them. Their directory stays off
    # PATH, so ccache finds the real compilers there. The release build is
    # static, so the copies need no DLLs next to them.
    - name: Install ccache
      run: |
        tmp="$(cygpath -u "$RUNNER_TEMP")"
        zip="$tmp/ccache.zip"
        bin="$tmp/ccache-bin"
        curl -fsSL -o "$zip" "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-windows-x86_64.zip"
        echo "$CCACHE_SHA256  $zip" | sha256sum -c -
        unzip -j -o "$zip" '*/ccache.exe' -d "$bin"
        cp "$bin/ccache.exe" "$bin/gcc.exe"
        cp "$bin/ccache.exe" "$bin/g++.exe"
        echo "CCACHE_BIN=$(cygpath -m "$bin")" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$(cygpath -m "$tmp/ccache")" >> "$GITHUB_ENV"

    # One entry per commit. restore-keys pick the newest, which lets a PR start
    # from master's cache.
    - name: Cache ccache
      uses: actions/cache@v3
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-ccache-${{ matrix.target }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ matrix.target }}-

    # "Install nimble deps" runs in Git Bash, whose HOME is the Windows profile,
    # and builds Nimble under it. MSYS2 has its own HOME, so without this make
    # would clone and build Nimble a second time, and that clone hangs.
    - name: Building ${{ matrix.target }}
      run: |
        export HOME="$(cygpath -u "$USERPROFILE")"
        export PATH="$GITHUB_WORKSPACE/.nim_runtime/bin:$HOME/.nimble/bin:$PATH"
        "$CCACHE_BIN/ccache.exe" --zero-stats
        ${{ matrix.make }} NIMFLAGS="--gcc.path:$CCACHE_BIN"

    - name: ccache stats
      run: |
        "$CCACHE_BIN/ccache.exe" --show-stats

    - name: Audit installed deps
      run: |
        export PATH="$GITHUB_WORKSPACE/.nim_runtime/bin:$PATH"
        make audit-deps

    - name: Check Executable
      run: |
        if [ ! -f "./${{ matrix.output }}" ]; then
          echo "Build failed: ${{ matrix.output }} not found"
          exit 1
        fi
        echo "${{ matrix.output }} build successful"

        if [ "${{ matrix.target }}" = logosdeliverynode ]; then
          cp /mingw64/bin/libpq.dll "$(dirname "${{ matrix.output }}")/"
          "./${{ matrix.output }}" --version
        fi
