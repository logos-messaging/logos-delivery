    dc: hk
    rate: 25
  - mode: Core
    dc: hk
    rate: 25
- id: r50
  duration: 120
  senders:
  - mode: Edge
    dc: hk
    rate: 50
  - mode: Core
    dc: hk
    rate: 50
- id: r100
  duration: 120
  senders:
  - mode: Edge
    dc: hk
    rate: 100
  - mode: Core
