# 2 senders (Edge+Core) and 2 receivers (Edge+Core) per case: the fleet prunes
# beyond 5 connections per source IP, so cases run one after another.
# Ramp message rate (per sender), then payload size at 5 msg/s, 120s per step.
name: breaking-hk
transports:
- tcp
- quic
settle: 30
step_gap: 15
receivers:
- mode: Edge
  dc: hk
- mode: Core
  dc: hk
steps:
- id: r1
  duration: 120
  senders:
  - mode: Edge
    dc: hk
    rate: 1
  - mode: Core
    dc: hk
    rate: 1
- id: r5
  duration: 120
  senders:
  - mode: Edge
    dc: hk
    rate: 5
  - mode: Core
    dc: hk
    rate: 5
- id: r10
  duration: 120
  senders:
  - mode: Edge
    dc: hk
    rate: 10
  - mode: Core
    dc: hk
    rate: 10
- id: r25
