# 2 senders (Edge+Core) and 2 receivers (Edge+Core) per case: the fleet prunes
# beyond 5 connections per source IP, so cases run one after another.
# Every DC pair (incl. same DC), 1 msg/s per sender for 180s. Any loss is a bug.
name: functional
transports:
- tcp
- quic
settle: 30
cases:
- id: ams-to-ams
  receivers:
  - mode: Edge
    dc: ams
  - mode: Core
    dc: ams
  steps:
  - id: 1
    duration: 180
    senders:
    - mode: Edge
      dc: ams
      rate: 1
    - mode: Core
      dc: ams
      rate: 1
- id: ams-to-us
  receivers:
  - mode: Edge
    dc: us
  - mode: Core
    dc: us
  steps:
  - id: 1
    duration: 180
    senders:
    - mode: Edge
      dc: ams
      rate: 1
    - mode: Core
      dc: ams
      rate: 1
- id: ams-to-hk
  receivers:
  - mode: Edge
    dc: hk
  - mode: Core
    dc: hk
  steps:
  - id: 1
    duration: 180
    senders:
    - mode: Edge
      dc: ams
      rate: 1
    - mode: Core
      dc: ams
      rate: 1
- id: us-to-ams
  receivers:
  - mode: Edge
    dc: ams
  - mode: Core
    dc: ams
  steps:
  - id: 1
    duration: 180
