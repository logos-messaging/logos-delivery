name: WakuExample
options:
  bundleIdPrefix: org.waku
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.0"
  SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  SUPPORTS_MACCATALYST: "NO"

targets:
  WakuExample:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - WakuExample
    settings:
      INFOPLIST_FILE: WakuExample/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: org.waku.example
      SWIFT_OBJC_BRIDGING_HEADER: WakuExample/WakuExample-Bridging-Header.h
      # `make ios_example` puts the library, its headers and TinyCBOR here.
      "LOGOS_LIB_DIR[sdk=iphoneos*]": "$(PROJECT_DIR)/../../build/ios/iphoneos-arm64"
      "LOGOS_LIB_DIR[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../build/ios/iphonesimulator-arm64"
      HEADER_SEARCH_PATHS:
        - "$(LOGOS_LIB_DIR)"
      LIBRARY_SEARCH_PATHS:
        - "$(LOGOS_LIB_DIR)"
      OTHER_LDFLAGS:
        - "-lc++"
        - "-force_load"
        - "$(LOGOS_LIB_DIR)/liblogosdelivery.a"
        - "-ltinycbor"
        - "-lleopard"
        - "-lsqlite3"
        - "-lz"
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    info:
      path: WakuExample/Info.plist
      properties:
        CFBundleName: WakuExample
        CFBundleDisplayName: Waku Example
        CFBundleIdentifier: org.waku.example
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

